<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestras Cartas — Leida & Junior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #ffd9e6;
    --paper: #ffeef5;
    --rosewood: #ff4f93;
    --rosewood-dark: #e6136e;
    --plum: #7a1249;
    --plum-soft: #c2447f;
    --gold: #ff8fc0;
    --line: rgba(230,19,110,0.22);
    --shadow: 0 18px 40px rgba(255,79,147,0.30);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--cream);
    color:var(--plum);
    font-family:'EB Garamond', serif;
    min-height:100vh;
  }

  body{
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,79,147,0.22), transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(255,143,192,0.26), transparent 45%);
  }

  h1,h2,h3{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    margin:0;
  }

  /* ---------- PANTALLA DE CONTRASEÑA ---------- */
  #gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .gate-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:var(--shadow);
    padding:56px 44px;
    max-width:420px;
    width:100%;
    text-align:center;
    position:relative;
  }

  .gate-card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(183,110,121,0.35);
    border-radius:2px;
    pointer-events:none;
  }

  .gate-mark{
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--rosewood-dark);
    margin-bottom:18px;
  }

  .gate-card h1{
    font-size:32px;
    font-style:italic;
    color:var(--plum);
    margin-bottom:10px;
    line-height:1.25;
  }

  .gate-sub{
    font-size:16px;
    color:var(--plum-soft);
    margin-bottom:32px;
    line-height:1.5;
  }

  #password-input{
    width:100%;
    font-family:'EB Garamond', serif;
    font-size:18px;
    text-align:center;
    letter-spacing:0.14em;
    padding:14px 16px;
    border:none;
    border-bottom:1.5px solid var(--rosewood);
    background:transparent;
    color:var(--plum);
    outline:none;
    margin-bottom:20px;
  }

  #password-input::placeholder{
    color:rgba(74,47,61,0.35);
    letter-spacing:0.05em;
  }

  #unlock-btn{
    font-family:'EB Garamond', serif;
    font-size:16px;
    letter-spacing:0.04em;
    background:var(--rosewood);
    color:#fff;
    border:none;
    padding:12px 34px;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.25s ease;
  }

  #unlock-btn:hover{
    background:var(--rosewood-dark);
  }

  #gate-error{
    margin-top:16px;
    font-size:14px;
    color:var(--rosewood-dark);
    min-height:18px;
    font-style:italic;
  }

  .gate-shake{
    animation:shake 0.4s ease;
  }

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }

  /* ---------- SITIO PRINCIPAL ---------- */
  #site{
    display:none;
    max-width:920px;
    margin:0 auto;
    padding:70px 24px 120px;
  }

  .site-header{
    text-align:center;
    margin-bottom:64px;
  }

  .eyebrow{
    font-size:14px;
    color:var(--rosewood-dark);
    font-style:italic;
    margin-bottom:8px;
  }

  .site-header h1{
    font-size:46px;
    font-style:italic;
    color:var(--plum);
  }

  .site-header p{
    margin-top:14px;
    font-size:17px;
    color:var(--plum-soft);
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
    line-height:1.6;
  }

  .letter-count{
    display:inline-block;
    margin-top:22px;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--gold);
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:6px 0;
  }

  #letters-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:28px;
  }

  .envelope{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:30px 24px;
    cursor:pointer;
    position:relative;
    box-shadow:0 8px 20px rgba(111,63,73,0.08);
    transition:transform 0.25s ease, box-shadow 0.25s ease;
    overflow:hidden;
  }

  .envelope:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 28px rgba(111,63,73,0.16);
  }

  .envelope::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:54px;
    background:
      linear-gradient(135deg, transparent 49.5%, var(--cream) 50%) top left / 50% 100% no-repeat,
      linear-gradient(45deg, transparent 49.5%, var(--cream) 50%) top right / 50% 100% no-repeat;
    border-bottom:1px solid var(--line);
  }

  .envelope-seal{
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--rosewood);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    margin:0 auto 16px;
    margin-top:14px;
    box-shadow:0 3px 8px rgba(183,110,121,0.4);
    position:relative;
    z-index:1;
  }

  .envelope-label{
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--rosewood-dark);
    text-align:center;
    margin-bottom:6px;
  }

  .envelope h3{
    font-size:22px;
    font-style:italic;
    text-align:center;
    color:var(--plum);
    line-height:1.3;
  }

  .envelope-hint{
    text-align:center;
    font-size:12px;
    color:var(--plum-soft);
    margin-top:12px;
    opacity:0.75;
  }

  /* ---------- MODAL DE CARTA ---------- */
  #overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(74,47,61,0.55);
    z-index:50;
    align-items:flex-start;
    justify-content:center;
    padding:5vh 20px;
    overflow-y:auto;
  }

  .letter-paper{
    background:var(--paper);
    max-width:920px;
    width:100%;
    height:88vh;
    border-radius:3px;
    padding:0;
    position:relative;
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
    animation:unfold 0.35s ease;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  @keyframes unfold{
    from{opacity:0; transform:translateY(24px) scale(0.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .letter-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 22px;
    border-bottom:1px solid var(--line);
    background:var(--cream);
  }

  .letter-topbar-text{
    display:flex;
    flex-direction:column;
    gap:2px;
    overflow:hidden;
  }

  .letter-date{
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--rosewood-dark);
    font-style:italic;
  }

  .letter-title{
    font-size:19px;
    font-style:italic;
    color:var(--plum);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .letter-topbar-actions{
    display:flex;
    align-items:center;
    gap:16px;
    flex-shrink:0;
  }

  .letter-open-tab{
    font-family:'EB Garamond', serif;
    font-size:13px;
    color:var(--rosewood-dark);
    text-decoration:none;
    border-bottom:1px solid var(--rosewood);
    white-space:nowrap;
  }

  .letter-open-tab:hover{ color:var(--rosewood); }

  .letter-close{
    background:none;
    border:none;
    font-size:24px;
    color:var(--plum-soft);
    cursor:pointer;
    line-height:1;
  }

  .letter-close:hover{ color:var(--rosewood-dark); }

  #letter-frame{
    flex:1;
    width:100%;
    border:none;
    background:#fff;
  }

  @media (max-width:520px){
    .gate-card{padding:44px 26px;}
    .site-header h1{font-size:36px;}
    .letter-paper{height:92vh;}
    .letter-title{font-size:16px;}
    .letter-topbar{padding:12px 16px;}
  }
</style>
</head>
<body>

<!-- ============ PANTALLA DE CONTRASEÑA ============ -->
<div id="gate">
  <div class="gate-card" id="gate-card">
    <div class="gate-mark">L &amp; J</div>
    <h1>Nuestras cartas</h1>
    <p class="gate-sub">Este lugar guarda cada carta que te he escrito.<br>Para entrar, escribe nuestra fecha.</p>
    <input type="password" id="password-input" placeholder="• • • • • • • •" autocomplete="off" inputmode="numeric">
    <br>
    <button id="unlock-btn">Entrar</button>
    <div id="gate-error"></div>
  </div>
</div>

<!-- ============ SITIO PRINCIPAL ============ -->
<div id="site">
  <div class="site-header">
    <div class="eyebrow">para Leida Camila</div>
    <h1>Nuestras cartas</h1>
    <p>Aquí voy a guardar cada carta que te he escrito, para que las tengas siempre que quieras, todas juntas, en un solo lugar.</p>
    <div class="letter-count" id="letter-count"></div>
  </div>

  <div id="letters-grid"></div>
</div>

<!-- ============ MODAL PARA LEER LA CARTA ============ -->
<div id="overlay">
  <div class="letter-paper">
    <div class="letter-topbar">
      <div class="letter-topbar-text">
        <div class="letter-date" id="modal-date"></div>
        <div class="letter-title" id="modal-title"></div>
      </div>
      <div class="letter-topbar-actions">
        <a href="#" id="modal-open-tab" class="letter-open-tab" target="_blank" rel="noopener">pantalla completa ↗</a>
        <button class="letter-close" id="close-letter">&times;</button>
      </div>
    </div>
    <iframe id="letter-frame" src="" title="carta"></iframe>
  </div>
</div>

<script>
/* ======================================================
   CONTRASEÑA
   Cámbiala aquí si algún día quieren usar otra.
   ====================================================== */
  const SITE_PASSWORD = "20052007";

/* ======================================================
   CARTAS
   Cada carta es un sitio web que ya hiciste. Para agregar
   una carta nueva, copia un bloque { ... } y pégalo dentro
   del arreglo. No necesitas tocar nada más del código.

   date  -> como quieras que se vea la fecha (texto libre)
   title -> el título de la carta
   url   -> el link del sitio web de esa carta
   ====================================================== */
  const letters = [
    {
      date: "15 de diciembre",
      title: "Aniversario de 9 meses",
      url: "https://mry29h4vdy-lang.github.io/aniversario-leida-junior/"
    },
    {
      date: "Carta de amor",
      title: "Una carta de amor",
      url: "https://mry29h4vdy-lang.github.io/carta-de-amor/"
    },
    {
      date: "Te amo",
      title: "I love you",
      url: "https://mry29h4vdy-lang.github.io/i-love-you/"
    }
  ];

/* ====================== LÓGICA DEL CANDADO ====================== */
  const gate = document.getElementById('gate');
  const gateCard = document.getElementById('gate-card');
  const site = document.getElementById('site');
  const input = document.getElementById('password-input');
  const unlockBtn = document.getElementById('unlock-btn');
  const gateError = document.getElementById('gate-error');

  function tryUnlock(){
    if(input.value === SITE_PASSWORD){
      gate.style.display = 'none';
      site.style.display = 'block';
      renderLetters();
    } else {
      gateError.textContent = 'Esa no es, mi amor. Intenta otra vez.';
      gateCard.classList.remove('gate-shake');
      void gateCard.offsetWidth;
      gateCard.classList.add('gate-shake');
      input.value = '';
    }
  }

  unlockBtn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });

/* ====================== RENDER DE CARTAS ====================== */
  const grid = document.getElementById('letters-grid');
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('close-letter');

  function renderLetters(){
    grid.innerHTML = '';
    document.getElementById('letter-count').textContent =
      letters.length === 1 ? '1 carta guardada' : letters.length + ' cartas guardadas';

    letters.forEach((letter, i) => {
      const card = document.createElement('div');
      card.className = 'envelope';
      card.innerHTML = `
        <div class="envelope-seal">L&amp;J</div>
        <div class="envelope-label">${letter.date}</div>
        <h3>${letter.title}</h3>
        <div class="envelope-hint">toca para abrir</div>
      `;
      card.addEventListener('click', () => openLetter(i));
      grid.appendChild(card);
    });
  }

  function openLetter(i){
    const letter = letters[i];
    document.getElementById('modal-date').textContent = letter.date;
    document.getElementById('modal-title').textContent = letter.title;
    document.getElementById('letter-frame').src = letter.url;
    document.getElementById('modal-open-tab').href = letter.url;
    overlay.style.display = 'flex';
  }

  function closeLetter(){
    overlay.style.display = 'none';
    document.getElementById('letter-frame').src = '';
  }

  closeBtn.addEventListener('click', closeLetter);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeLetter(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLetter(); });
</script>

</body>
</html>
